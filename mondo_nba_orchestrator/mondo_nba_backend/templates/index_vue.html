{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondo NBA - Vue</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .product-card img { height: 220px; object-fit: cover; }
    .rating { color: #f5a623; }
  </style>
</head>
<body>
  <div id="app" class="container py-4">
    <h1 class="mb-4">Mondo NBA</h1>
    <div class="row g-4">
      <div class="col-md-4" v-for="p in products" :key="p.id">
        <div class="card product-card h-100">
          <img :src="p.image" class="card-img-top" alt="">
          <div class="card-body">
            <h5 class="card-title">{{ p.name }}</h5>
            <p class="card-text text-muted">{{ p.category }}</p>
            <p class="card-text">{{ p.description }}</p>
            <p class="rating" v-html="'&#9733;'.repeat(p.valuation) + '&#9734;'.repeat(5-p.valuation)"></p>
            <p class="fw-bold">&euro;{{ p.price }}</p>
            <button class="btn btn-primary btn-sm" @click="addToCart(p)">Add to cart</button>
          </div>
        </div>
      </div>
    </div>
    <nav class="mt-4" v-if="next || previous">
      <button class="btn btn-outline-secondary me-2" :disabled="!previous" @click="load(previous)">Prev</button>
      <button class="btn btn-outline-secondary" :disabled="!next" @click="load(next)">Next</button>
    </nav>
  </div>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    const { createApp } = Vue;
    createApp({
      data() { return { products: [], next: null, previous: null }; },
      mounted() { this.load('/api/products/'); },
      methods: {
        async load(url) {
          const res = await fetch(url);
          const data = await res.json();
          this.products = data.results;
          this.next = data.next;
          this.previous = data.previous;
        },
        addToCart(p) {
          alert('Added ' + p.name + ' to cart');
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
